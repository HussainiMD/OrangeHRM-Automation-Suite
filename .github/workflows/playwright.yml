name: Playwright Tests
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:        # manual trigger from GH UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    timeout-minutes: 125
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for gh-pages deployment
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0    # full history needed for git push to work correctly

    - name: Check system resources before setup
      run: |
        echo "=== DISK SPACE BEFORE SETUP ==="
        df -h /
        echo ""
        echo "=== MOUNT INFORMATION ==="
        mount | grep -E '(/ |/tmp|/var)'
        echo ""
        echo "=== INODE USAGE ==="
        df -i /
        echo ""
        echo "=== HOME DIRECTORY SIZE ==="
        du -sh ~/ 2>/dev/null || echo "Cannot access home directory"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # currently v24 is on my machine
        cache: 'npm'

    - name: Clean up Playwright cache and previous installations
      run: |
        echo "=== CLEANING UP PLAYWRIGHT CACHE ==="
        rm -rf ~/.cache/ms-playwright* 2>/dev/null || echo "No playwright cache to clean"
        rm -rf ~/.cache/chromium 2>/dev/null || echo "No chromium cache to clean"
        rm -rf /tmp/playwright* 2>/dev/null || echo "No playwright temp files to clean"
        echo "Cleanup completed"
        echo ""
        echo "=== DISK SPACE AFTER CLEANUP ==="
        df -h /

    - name: Find Space Hogs - Diagnose Disk Usage
      run: |
        echo "=== TOP 10 SPACE CONSUMERS ON ENTIRE FILESYSTEM ==="
        du -shx /* 2>/dev/null | sort -rh | head -10
        echo ""
        echo "=== DETAILED /var ANALYSIS ==="
        du -sh /var/* 2>/dev/null | sort -rh | head -10 || echo "Cannot access /var"
        echo ""
        echo "=== DETAILED /tmp ANALYSIS ==="
        du -sh /tmp/* 2>/dev/null | sort -rh | head -10 || echo "Cannot access /tmp"
        echo ""
        echo "=== HOME DIRECTORY BREAKDOWN ==="
        du -sh ~/* 2>/dev/null | sort -rh | head -15 || echo "Unable to analyze home directory"
        echo ""
        echo "=== CACHE DIRECTORIES ==="
        du -sh ~/.cache/* 2>/dev/null | sort -rh | head -10 || echo "No cache directories found"
        echo ""
        echo "=== DOCKER ANALYSIS ==="
        docker system df 2>/dev/null || echo "Docker not available or not consuming space"
        echo ""
        echo "=== SYSTEM LOG FILES ==="
        find /var/log -type f -size +100M 2>/dev/null | head -10 || echo "No large log files found"
        echo ""
        echo "=== OLD TEST ARTIFACTS (allure-results, test-results, playwright-report) ==="
        du -sh allure-results 2>/dev/null || echo "No allure-results"
        du -sh test-results 2>/dev/null || echo "No test-results"
        du -sh playwright-report 2>/dev/null || echo "No playwright-report"
        echo ""
        echo "=== CURRENT DISK STATUS ==="
        df -h /

    - name: Install dependencies
      run: |
        echo "=== NPM INSTALL ===" 
        npm ci --loglevel=verbose
        echo ""
        echo "=== PLAYWRIGHT VERSION AFTER NPM INSTALL ==="
        npx playwright --version

    - name: Aggressive System-wide Disk Cleanup
      run: |
        echo "=== AGGRESSIVE SYSTEM-WIDE CLEANUP STARTING ==="
        echo ""
        echo "=== CLEANING /var/cache ==="
        sudo rm -rf /var/cache/apt/* 2>/dev/null && echo "✓ Cleaned apt cache" || echo "No apt cache or insufficient permissions"
        sudo rm -rf /var/cache/yum/* 2>/dev/null && echo "✓ Cleaned yum cache" || echo "No yum cache or insufficient permissions"
        echo ""
        echo "=== CLEANING /var/log ==="
        sudo truncate -s 0 /var/log/syslog 2>/dev/null && echo "✓ Truncated syslog" || echo "No syslog or insufficient permissions"
        sudo truncate -s 0 /var/log/apt/term.log 2>/dev/null && echo "✓ Truncated apt log" || echo "No apt log"
        echo ""
        echo "=== VACUUMING JOURNAL LOGS ==="
        sudo journalctl --vacuum=time=1d 2>/dev/null && echo "✓ Vacuumed journal" || echo "journalctl not available"
        echo ""
        echo "=== CLEANING USER CACHES ==="
        rm -rf ~/.npm 2>/dev/null && echo "✓ Removed npm cache" || echo "No npm cache"
        rm -rf ~/.cache/pip 2>/dev/null && echo "✓ Removed pip cache" || echo "No pip cache"
        rm -rf ~/.cache/gradle 2>/dev/null && echo "✓ Removed gradle cache" || echo "No gradle cache"
        rm -rf ~/.m2 2>/dev/null && echo "✓ Removed maven cache" || echo "No maven cache"
        echo ""
        echo "=== CLEANING PLAYWRIGHT CACHE ==="
        rm -rf ~/.cache/ms-playwright* 2>/dev/null && echo "✓ Removed playwright cache" || echo "No playwright cache"
        rm -rf ~/.cache/chromium 2>/dev/null && echo "✓ Removed chromium cache" || echo "No chromium cache"
        echo ""
        echo "=== CLEANING TEST ARTIFACTS FROM PREVIOUS RUNS ==="
        rm -rf allure-results/* 2>/dev/null && echo "✓ Cleaned allure-results" || echo "No allure-results"
        rm -rf test-results/* 2>/dev/null && echo "✓ Cleaned test-results" || echo "No test-results"
        rm -rf playwright-report/* 2>/dev/null && echo "✓ Cleaned playwright-report" || echo "No playwright-report"
        rm -f playwright-install*.log 2>/dev/null && echo "✓ Cleaned installation logs" || echo "No install logs"
        echo ""
        echo "=== DOCKER CLEANUP ==="
        docker system prune -a -f 2>/dev/null && echo "✓ Docker system pruned" || echo "Docker not available or no dangling images"
        docker image prune -a -f 2>/dev/null && echo "✓ Docker images pruned" || echo "Docker images already cleaned"
        echo ""
        echo "=== CLEANING /tmp ==="
        sudo rm -rf /tmp/* 2>/dev/null && echo "✓ Cleaned /tmp" || echo "Cannot clean /tmp or insufficient permissions"
        echo ""
        echo "=== POST-CLEANUP DISK SPACE ==="
        df -h /
        echo ""
        echo "=== POST-CLEANUP HOME DIRECTORY SIZE ==="
        du -sh ~/ 2>/dev/null || echo "Cannot measure home directory"
        echo ""
        echo "=== POST-CLEANUP FREE INODES ==="
        df -i / | tail -1

    - name: Install Playwright Browsers - Pass 1
      run: |
        echo "=== STARTING PLAYWRIGHT BROWSER INSTALLATION (PASS 1) ==="
        echo "Installation start time: $(date)"
        echo "Setting verbose logging..."
        export DEBUG=pw:api
        echo ""
        echo "Installing all required browsers: chromium, firefox, webkit"
        timeout 300 npx playwright install chromium firefox webkit --with-deps 2>&1 | tee playwright-install.log &
        PID=$!
        
        # Monitor the process and print resource usage every 30 seconds
        while kill -0 $PID 2>/dev/null; do
          sleep 30
          echo "[$(date)] Installation still running (PID: $PID)..."
          echo "Disk space:"
          df -h /
          echo "Free inodes:"
          df -i / | tail -1
          echo "Memory usage:"
          free -h
          echo "Processes using most memory:"
          ps aux --sort=-%mem | head -6
          echo ""
        done
        
        wait $PID
        EXIT_CODE=$?
        echo ""
        echo "=== PLAYWRIGHT INSTALLATION COMPLETED (PASS 1) ==="
        echo "Exit code: $EXIT_CODE"
        echo "Installation end time: $(date)"
        echo ""
        echo "=== DISK SPACE AFTER BROWSER INSTALLATION ==="
        df -h /
        echo ""
        echo "=== INSTALLED BROWSER LOCATION ==="
        find ~/.cache -type d -name "ms-playwright*" 2>/dev/null | head -5 || echo "No browser installations found"
        echo ""
        echo "=== BROWSER SIZE BREAKDOWN ==="
        du -sh ~/.cache/ms-playwright* 2>/dev/null | sort -rh || echo "No browser caches to measure"
        echo ""
        echo "=== PLAYWRIGHT CACHE CONTENTS ==="
        ls -la ~/.cache/ms-playwright* 2>/dev/null | head -20 || echo "No browser cache found"
        echo ""
        echo "=== INSTALLATION LOG TAIL ==="
        tail -50 playwright-install.log
        
        exit $EXIT_CODE

    - name: Verify Playwright Installation
      run: |
        echo "=== VERIFYING PLAYWRIGHT INSTALLATION ==="
        npx playwright --version
        echo ""
        echo "=== CHECKING INSTALLED BROWSER BINARIES ==="
        echo "Chromium:"
        test -d ~/.cache/ms-playwright/chromium-* && echo "✓ Chromium found" || echo "✗ Chromium NOT found"
        echo ""
        echo "Firefox:"
        test -d ~/.cache/ms-playwright/firefox-* && echo "✓ Firefox found" || echo "✗ Firefox NOT found"
        echo ""
        echo "WebKit:"
        test -d ~/.cache/ms-playwright/webkit-* && echo "✓ WebKit found" || echo "✗ WebKit NOT found"
        echo ""
        echo "=== LISTING ALL INSTALLED BROWSERS ==="
        ls -1 ~/.cache/ms-playwright/ 2>/dev/null | grep -E "^(chromium|firefox|webkit)" || echo "No browser directories found"
        echo ""
        echo "=== FULL PLAYWRIGHT CACHE STRUCTURE ==="
        tree -L 2 ~/.cache/ms-playwright/ 2>/dev/null || find ~/.cache/ms-playwright -maxdepth 2 -type d | sort
        echo ""
        echo "=== VERIFYING EXECUTABLE FILES EXIST ==="
        echo "Chromium executable:"
        find ~/.cache/ms-playwright/chromium-* -name "chrome-linux64" -type d 2>/dev/null && \
          test -x ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome && echo "✓ Chromium executable found" || echo "✗ Chromium executable NOT found"
        echo ""
        echo "Firefox executable:"
        find ~/.cache/ms-playwright/firefox-* -name "firefox" -type d 2>/dev/null && \
          test -x ~/.cache/ms-playwright/firefox-*/firefox/firefox && echo "✓ Firefox executable found" || echo "✗ Firefox executable NOT found"
        echo ""
        echo "WebKit executable:"
        find ~/.cache/ms-playwright/webkit-* -name "pw_run.sh" -type f 2>/dev/null && echo "✓ WebKit executable found" || echo "✗ WebKit executable NOT found"
        echo ""
        echo "=== CHECKING FILE SIZES (should be > 100MB for each browser) ==="
        du -sh ~/.cache/ms-playwright/chromium-* 2>/dev/null | tail -1
        du -sh ~/.cache/ms-playwright/firefox-* 2>/dev/null | tail -1
        du -sh ~/.cache/ms-playwright/webkit-* 2>/dev/null | tail -1
        echo ""
        echo "=== LISTING ACTUAL BINARY FILES ==="
        find ~/.cache/ms-playwright -type f -executable \( -name "chrome" -o -name "firefox" -o -name "chrome-headless-shell" \) 2>/dev/null | head -10

    - name: Install Playwright Browsers - Pass 2 (Retry All)
      run: |
        echo "=== RETRY: PLAYWRIGHT BROWSER INSTALLATION (PASS 2) ==="
        echo "Installation start time: $(date)"
        export DEBUG=pw:api
        echo ""
        echo "Explicitly installing: chromium firefox webkit"
        timeout 300 npx playwright install chromium firefox webkit 2>&1 | tee -a playwright-install.log &
        PID=$!
        
        while kill -0 $PID 2>/dev/null; do
          sleep 30
          echo "[$(date)] Retry installation running..."
          df -h /
          free -h
          echo ""
        done
        
        wait $PID
        EXIT_CODE=$?
        echo ""
        echo "=== RETRY INSTALLATION COMPLETED (PASS 2) ==="
        echo "Exit code: $EXIT_CODE"
        echo "Installation end time: $(date)"
        echo ""
        echo "=== FINAL BROWSER VERIFICATION ==="
        echo "Chromium:"
        find ~/.cache -type d -name "chromium-*" 2>/dev/null && echo "✓ Chromium installed" || echo "✗ Chromium missing"
        echo "Firefox:"
        find ~/.cache -type d -name "firefox-*" 2>/dev/null && echo "✓ Firefox installed" || echo "✗ Firefox missing"
        echo "WebKit:"
        find ~/.cache -type d -name "webkit-*" 2>/dev/null && echo "✓ WebKit installed" || echo "✗ WebKit missing"
        
        exit $EXIT_CODE
   
    - name: Pre-Test Browser Executable Verification
      run: |
        echo "=== PRE-TEST BROWSER EXECUTABLE VERIFICATION ==="
        echo ""
        echo "Checking for Chromium executable..."
        CHROMIUM_PATH=$(find ~/.cache/ms-playwright/chromium-* -name "chrome" -type f 2>/dev/null | head -1)
        if [ -z "$CHROMIUM_PATH" ]; then
          echo "❌ ERROR: Chromium executable 'chrome' not found"
          find ~/.cache/ms-playwright/chromium-* -type f 2>/dev/null | head -20
          exit 1
        elif [ ! -x "$CHROMIUM_PATH" ]; then
          echo "❌ ERROR: Chromium executable found but not executable: $CHROMIUM_PATH"
          ls -la "$CHROMIUM_PATH"
          exit 1
        else
          echo "✓ Chromium executable found: $CHROMIUM_PATH"
          ls -lh "$CHROMIUM_PATH"
          echo "Running chromium version check:"
          "$CHROMIUM_PATH" --version || echo "Warning: Could not get chromium version"
        fi
        echo ""
        echo "Checking for Firefox executable..."
        FIREFOX_PATH=$(find ~/.cache/ms-playwright/firefox-* -name "firefox" -type f 2>/dev/null | head -1)
        if [ -z "$FIREFOX_PATH" ]; then
          echo "⚠ WARNING: Firefox executable not found (may not be required for this run)"
        elif [ ! -x "$FIREFOX_PATH" ]; then
          echo "⚠ WARNING: Firefox executable found but not executable: $FIREFOX_PATH"
        else
          echo "✓ Firefox executable found: $FIREFOX_PATH"
        fi
        echo ""
        echo "Checking for WebKit executable..."
        WEBKIT_PATH=$(find ~/.cache/ms-playwright/webkit-* -name "pw_run.sh" -type f 2>/dev/null | head -1)
        if [ -z "$WEBKIT_PATH" ]; then
          echo "⚠ WARNING: WebKit executable not found (may not be required for this run)"
        else
          echo "✓ WebKit executable found: $WEBKIT_PATH"
        fi
        echo ""
        echo "=== FULL EXECUTABLE LISTING ==="
        find ~/.cache/ms-playwright -type f -executable 2>/dev/null | sort

    - name: Run Playwright tests      
      run: | # if condition (manual trigger only) to update playwright snapshots
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then 
          npm run lint && npm run playwright -- --update-snapshots
        else
          npm run testscript  # picks script from package.json. By default runs all projects defined in config
        fi        
      env: 
        base_url: ${{ secrets.BASE_URL }}
        api_timeout: ${{ secrets.API_TIMEOUT }}
        test_global_timeout: ${{ secrets.TEST_GLOBAL_TIMEOUT }}
        test_expect_timeout: ${{ secrets.TEST_EXPECT_TIMEOUT }}
        admin_user_name: ${{ secrets.ADMIN_USER_NAME }}
        admin_password: ${{ secrets.ADMIN_PASSWORD }}
        ess_user_name: ${{ secrets.ESS_USER_NAME }}
        ess_user_password: ${{ secrets.ESS_USER_PASSWORD }}
        test_employee_dir: "storage"
        mailtrap_base_url: ${{ secrets.MAILTRAP_BASE_URL }}
        mailtrap_api_token: ${{ secrets.MAILTRAP_API_TOKEN }}
        mailtrap_smtp_user_name: ${{ secrets.MAILTRAP_SMTP_USER_NAME }}
        mailtrap_smtp_user_Password: ${{ secrets.MAILTRAP_SMTP_USER_PASSWORD }}
        mailtrap_account_id: ${{ secrets.MAILTRAP_ACCOUNT_ID }}
        mailtrap_inbox_id: ${{ secrets.MAILTRAP_INBOX_ID }}

    - name: Commit updated snapshots
      if: always() && github.event_name == 'workflow_dispatch'
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add tests/
        git commit -m "chore: update Linux baseline screenshots" || echo "No changes to commit"
        git push

    - name: Upload Playwright HTML report
      if: always()                # upload even on test failure
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
    
    - name: Upload Playwright traces  
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: playwright-traces
        path: test-results/          # traces land here by default
        retention-days: 7

    - name: Download previous Allure history
      if: always()
      continue-on-error: true  # won't faill if first run
      uses: dawidd6/action-download-artifact@v6
      with:
        name: allure-history
        path: allure-results/history
        workflow: playwright.yml
        branch: main
        workflow_conclusion: any        # picks up artifacts from failed runs too
        search_artifacts: true        # scan through previous runs to find the artifact by name
        if_no_artifact_found: warn   # won't fail on first ever run
    
    - name: Generate Allure Report # We do NOT need traces ZIPs for allure report. Anything more than 10 MB can cause issues (FREE Limit: 100 MB), so deleting
      if: always()
      run: | 
        find allure-results/ -name "*.zip" -size +10M -delete
        npx --yes --package=allure-commandline allure generate allure-results --clean --output allure-report
      # --package=allure-commandline tells npx which package to pull, allure is the actual binary to run. --yes skips the install confirmation prompt on CI.    

    - name: Ensure Allure history directory exists
      if: always()
      run: mkdir -p allure-report/history

    - name: Upload Allure history for next run
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-history
        path: allure-report/history/
        retention-days: 30   
        overwrite: true   

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
       name: allure-report
       path: allure-report/
       retention-days: 14

    - name: Deploy Allure Report to GitHub Pages
      if: always() && github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
       github_token: ${{ secrets.GITHUB_TOKEN }} # GitHub injects it automatically
       publish_dir: ./allure-report
